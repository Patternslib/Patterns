<!DOCTYPE html>
<html lang="de">
  <head>
    <title>Form validation</title>
    <meta charset="utf-8" />
    <link href="/style/common.css"
          rel="stylesheet"
    />
    <script src="/bundle.min.js"></script>
    <style>
          input:required {
            border: 1px solid red;
          }
          time.output-field {
            min-width: 6em;
            height: 2em;
            padding: 0 0.5em;
            background: lightgrey;
            box-sizing: border-box;
            display: inline-block;
          }
          time.output-field:not(.disabled) {
            cursor: pointer;
          }
          .cancel-button {
            display: inline-block;
            width: 1em;
            height: 1em;
            margin-left: 0.2em;
            background-color: blue;
          }
    </style>
  </head>
  <body>
    <form class="pat-validation vertical"
          action="."
          method="get"
          data-pat-validation="disable-selector: .pat-button"
    >
      <fieldset class="horizontal">
        <label>Full name
          <input autocomplete="off"
                 name="name"
                 required
                 type="text"
          />
        </label>

        <label>Age
          <input autocomplete="off"
                 max="65"
                 min="16"
                 name="age"
                 required
                 type="number"
          />
        </label>

        <label>Real number, limited between 10.0 and 10.9, with a step of 0.1.
          <input autocomplete="off"
                 max="10.9"
                 min="10.0"
                 name="real"
                 step="0.1"
                 type="number"
          />
        </label>

        <label>Real number, limited between 10.0 and 10.9, with a step of ``any``.
          <input autocomplete="off"
                 max="10.9"
                 min="10.0"
                 name="real"
                 step="any"
                 type="number"
          />
        </label>

        <label>URL
          <input autocomplete="off"
                 name="url"
                 placeholder="https://example.com"
                 type="url"
          />
        </label>

        <label>E-mail
          <input autocomplete="off"
                 name="email"
                 type="email"
          />
        </label>

        <fieldset class="group pat-checklist radio">
          <legend>Favourite colour</legend>
          <label>
            <input autocomplete="off"
                   name="colour"
                   required
                   type="radio"
                   value="blue"
            />
            Blue
          </label>
          <label>
            <input autocomplete="off"
                   name="colour"
                   required
                   type="radio"
                   value="pink"
            />
            Pink
          </label>
          <label>
            <input autocomplete="off"
                   name="colour"
                   required
                   type="radio"
                   value="red"
            />
            Red
          </label>
          <label>
            <input autocomplete="off"
                   name="colour"
                   required
                   type="radio"
                   value="yellow"
            />
            yellow
          </label>
        </fieldset>

        <label>Planning start
          <input class="pat-date-picker"
                 id="planning-start"
                 autocomplete="off"
                 name="measure.planning_start:records"
                 type="date"
                 value="2015-10-10"
                 data-pat-validation="not-after: #planning-end; message-date: This date must be on or before the end date."
          />
        </label>

        <label>Planning end
          <input class="pat-date-picker"
                 id="planning-end"
                 autocomplete="off"
                 name="measure.planning_end:records"
                 type="date"
                 value="2015-09-09"
                 data-pat-validation="not-before: #planning-start; message-date: This date must be on or after the start date."
          />
        </label>

        <label>Required date
          <input id="date-required"
                 autocomplete="off"
                 name="measure.date-required:records"
                 required
                 type="date"
          />
        </label>

        <label>Optional date
          <input id="date-optional"
                 autocomplete="off"
                 name="measure.date-optional:records"
                 type="date"
          />
        </label>

        <label>Disabled start
          <input class="pat-date-picker"
                 id="disabled_start"
                 autocomplete="off"
                 disabled
                 name="disabled_start"
                 type="date"
                 value="2021-04-21"
                 data-pat-validation="not-after: #planning-end; message-date: This date must be on or before the end date."
          />
        </label>

        <label>End
          <input class="pat-date-picker"
                 id="disabled_end"
                 autocomplete="off"
                 name="disabled_end"
                 type="date"
                 data-pat-validation="not-before: #disabled_start; message-date: This date must be on or after the start date."
          />
        </label>

        <hr />

        <label>Date/Time start
          <input id="datetime-start"
                 autocomplete="off"
                 name="datetime-start"
                 type="datetime-local"
                 value="2022-01-05T10:00"
                 data-pat-validation="not-after: #datetime-end; message-date: This date/time must be on or before the end date/time."
          />
        </label>

        <label>Date/Time end
          <input id="datetime-end"
                 autocomplete="off"
                 name="datetime-end"
                 type="datetime-local"
                 value="2022-01-05T14:00"
                 data-pat-validation="not-before: #datetime-start; message-date: This date/time must be on or after the start date/time."
          />
        </label>

        <hr />

        <label>Password
          <input id="password"
                 autocomplete="off"
                 name="password"
                 type="password"
          />
        </label>

        <label>Password confirmation
          <input id="password-confirmation"
                 autocomplete="off"
                 name="password-confirmation"
                 type="password"
                 data-pat-validation="equality: password; message-equality: This field needs to be equal to %{attribute}"
          />
        </label>

        <label>Food preference
          <input class="pat-autosuggest"
                 id="a1"
                 autocomplete="off"
                 name="a1"
                 placeholder="Pick some fruit"
                 required="required"
                 type="text"
                 data-pat-autosuggest="words: Apples, Oranges, Pears, Bananas; maximum-selection-size: 1"
          />
        </label>

        <label>Custom template
          <input autocomplete="off"
                 name="custom-template"
                 required
                 type="text"
                 data-pat-validation="error-template: &lt;h1 class='validation-error'&gt;${this.message}&lt;/h1&gt;"
          /></label>

        <fieldset class="buttons">
          <button class="pat-button">Test</button>
          <button>Submit</button>
          <button formnovalidate>Cancel</button>
        </fieldset>
      </fieldset>
    </form>

    <h2>Demo with max-values / min-values support</h2>

    <label>
        Note: input outside form.
      <input form="form-min-max-1"
             name="outside"
             value="1"
             data-pat-validation="min-values: 1"
      />
    </label>


    <form class="pat-validation pat-checklist"
          id="form-min-max-1"
          action="."
          method="post"
    >
      <fieldset>
        <legend>Multi select</legend>
        name: select, type: select
        <select multiple
                name="select"
                required
                data-pat-validation="
                min-values: 2;
                max-values: 3;
              "
        >
          <option value="a">a</option>
          <option value="b">b</option>
          <option value="c">c</option>
          <option value="d">d</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Multiple checkboxes</legend>
        <label>
            name: checkbox[], type: checkbox, value: a
          <input name="checkbox[]"
                 type="checkbox"
                 value="a"
                 data-pat-validation="
                  min-values: 1;
                  max-values: 3;
                "
          />
        </label>
        <label>
            name: checkbox[], type: checkbox, value: b
          <input name="checkbox[]"
                 type="checkbox"
                 value="b"
                 data-pat-validation="
                  min-values: 1;
                  max-values: 3;
                "
          />
        </label>
        <label>
            name: checkbox[], type: checkbox, value: c
          <input name="checkbox[]"
                 type="checkbox"
                 value="c"
                 data-pat-validation="
                  min-values: 1;
                  max-values: 3;
                "
          />
        </label>
        <label>
            name: checkbox[], type: checkbox, value: d
          <input name="checkbox[]"
                 type="checkbox"
                 value="d"
                 data-pat-validation="
                  min-values: 1;
                  max-values: 3;
                "
          />
        </label>
      </fieldset>

      <fieldset data-pat-validation="
                min-values: 2;
                max-values: 3;
            ">
        <legend>
          <h3>Demo with mixed inputs and max/min values support.</h3>
          <p>min-values: 2, max-values: 3</p>
        </legend>
        <fieldset>
          name: multiple, select
          <select multiple
                  name="multiple"
          >
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
          </select>
        </fieldset>
        <fieldset>
          <label>
              name: multiple, value: a
            <input name="multiple"
                   type="checkbox"
                   value="a"
            />
          </label>
          <label>
              name: multiple, value: b
            <input name="multiple"
                   type="checkbox"
                   value="b"
            />
          </label>
          <label>
              name: multiple, value: c
            <input name="multiple"
                   type="checkbox"
                   value="c"
            />
          </label>
          <label>
              name: multiple, value: d
            <input name="multiple"
                   type="checkbox"
                   value="d"
            />
          </label>
        </fieldset>
        <fieldset>
          <label>
              name: multiple, input 1
            <input name="multiple" />
          </label>
          <label>
              name: multiple, input 2
            <input name="multiple" />
          </label>
          <label>
              name: multiple, input 3
            <input name="multiple" />
          </label>
        </fieldset>
      </fieldset>
      <fieldset class="buttons">
        <button>Submit</button>
        <button formnovalidate>Cancel</button>
      </fieldset>
    </form>

    <div class="pat-modal">
      <form class="pat-inject vertical pat-validation"
            action="."
            method="get"
            data-pat-validation="disable-selector: [type=submit], button:not([type=button])"
      >
        <fieldset class="horizontal">
          <label>First of all!
            <input autocomplete="off"
                   name="first"
                   required
            /></label>

          <label>Optional subtext
            <input autocomplete="off"
                   name="optional"
            /></label>

          <label>Start
            <input class="pat-date-picker"
                   autocomplete="off"
                   name="mod-3"
                   required
                   type="date"
                   data-pat-validation="not-after: [name=mod-4]"
            />
          </label>

          <label>End
            <input class="pat-date-picker"
                   autocomplete="off"
                   name="mod-4"
                   required
                   type="date"
                   data-pat-date-picker="after: [name=mod-3]"
                   data-pat-validation="not-before: [name=mod-3]"
            />
          </label>

          <label>Preference
            <input class="pat-autosuggest"
                   autocomplete="off"
                   name="mod-5"
                   required
                   data-pat-autosuggest="words: Gibson, Fender, Washburn, Strandberg"
            />
          </label>

        </fieldset>
        <fieldset class="buttons">
          <button class="close-panel"
                  type="submit"
          >Submit</button>
          <button class="close-panel"
                  formnovalidate
                  type="button"
          >Cancel</button>
        </fieldset>
      </form>
    </div>

  </body>
</html>
