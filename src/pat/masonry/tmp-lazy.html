<!DOCTYPE html>
<html>
    <head>
        <title>tmp masonry lazy images</title>
        <meta charset="utf-8" />
        <script src="/bundle.min.js"></script>
        <style>
            body { font-family: sans-serif; }
            .demo { width: 1050px; background: #eee; min-height: 40px; margin-bottom: 2em; }
            .item { width: 200px; background: #fc9; margin-bottom: 10px; position: relative; opacity: 0; transition: opacity 0.5s; }
            .masonry-ready .item { opacity: 1; }
            .item img { display: block; max-width: 100%; height: auto; }
            .item span { position: absolute; top: 2px; left: 4px; font-weight: bold; }
        </style>
    </head>
    <body>
        <p>All images are delivered after 2 seconds. Reload to watch again.</p>
        <h3>A) Normal images (masonry-ready waits for them)</h3>
        <div id="eager" class="pat-masonry demo" data-pat-masonry="column-width: 200; gutter: 10; item-selector: .item">
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?eager0" /><span>1</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?eager1" /><span>2</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?eager2" /><span>3</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?eager3" /><span>4</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?eager4" /><span>5</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?eager5" /><span>6</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?eager6" /><span>7</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?eager7" /><span>8</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?eager8" /><span>9</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?eager9" /><span>10</span></div>
        </div>

        <h3>B) loading=lazy, no width/height</h3>
        <div id="lazy" class="pat-masonry demo" data-pat-masonry="column-width: 200; gutter: 10; item-selector: .item">
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?lazy0" loading="lazy" /><span>1</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?lazy1" loading="lazy" /><span>2</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?lazy2" loading="lazy" /><span>3</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?lazy3" loading="lazy" /><span>4</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?lazy4" loading="lazy" /><span>5</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?lazy5" loading="lazy" /><span>6</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?lazy6" loading="lazy" /><span>7</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?lazy7" loading="lazy" /><span>8</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?lazy8" loading="lazy" /><span>9</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?lazy9" loading="lazy" /><span>10</span></div>
        </div>

        <h3>C) loading=lazy with width/height</h3>
        <div id="lazydim" class="pat-masonry demo" data-pat-masonry="column-width: 200; gutter: 10; item-selector: .item">
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?lazydim0" loading="lazy" width="200" height="300" /><span>1</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?lazydim1" loading="lazy" width="200" height="150" /><span>2</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?lazydim2" loading="lazy" width="200" height="302" /><span>3</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?lazydim3" loading="lazy" width="200" height="218" /><span>4</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?lazydim4" loading="lazy" width="200" height="300" /><span>5</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/bouquet.jpg?lazydim5" loading="lazy" width="200" height="300" /><span>6</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/flower-of-happiness.jpg?lazydim6" loading="lazy" width="200" height="150" /><span>7</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/lillies.jpg?lazydim7" loading="lazy" width="200" height="302" /><span>8</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/petunia.jpg?lazydim8" loading="lazy" width="200" height="218" /><span>9</span></div>
                <div class="item"><img alt="" src="http://127.0.0.1:3002/img/woolflowers.jpg?lazydim9" loading="lazy" width="200" height="300" /><span>10</span></div>
        </div>

    </body>
</html>
