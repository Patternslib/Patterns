<!DOCTYPE html>
<html lang="de">
    <head>
        <title>Form validation</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/style/common.css" />
        <script src="/bundle.min.js"></script>
        <style>
            input:required {
                border: 1px solid red;
            }
            time.output-field {
                min-width: 6em;
                height: 2em;
                padding: 0 0.5em;
                background: lightgrey;
                box-sizing: border-box;
                display: inline-block;
            }
            time.output-field:not(.disabled) {
                cursor: pointer;
            }
            .cancel-button {
                display: inline-block;
                width: 1em;
                height: 1em;
                margin-left: 0.2em;
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <h2>Demo with max-values / min-values support</h2>
        <input
            name="outside"
            form="form"
            data-pat-validation="min-values: 1"
            value="1"
        />

        <form class="pat-validation pat-checklist" action="." method="post" id="form">
            <input name="inside" required />
            <fieldset class="buttons">
                <button>Submit</button>
                <button formnovalidate>Cancel</button>
            </fieldset>
        </form>

        <script>
            const form = document.querySelector("#form");
            form.addEventListener("input", (e) => console.log("input: ", e.target.name));
            form.addEventListener("change", (e) =>
                console.log("change: ", e.target.name)
            );
            form.addEventListener("focusout", (e) => console.log("focusout: ", e.target.name));

            document.addEventListener("input", (e) => console.log("input: ", e.target));
        </script>
    </body>
</html>
