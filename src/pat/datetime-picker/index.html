<!DOCTYPE html>
<html>
  <head>
    <title>pat-datetime-picker demo page</title>
    <meta charset="utf-8" />
    <script>
            window.__patternslib_import_styles = true;
    </script>
    <link href="/style/common.css"
          rel="stylesheet"
    />
    <script src="/bundle.min.js"></script>
  </head>
  <body>
    <form action="">
      <fieldset class="vertical">
        <label>Default value
          <input class="pat-datetime-picker"
                 type="datetime-local"
                 value="2015-01-01T12:34"
          />
        </label><br />
        <label>Start at Monday
          <input class="pat-datetime-picker"
                 type="datetime-local"
                 value="2015-01-01T12:34"
                 data-pat-datetime-picker="behavior: styled; first-day: 1"
          />
        </label><br />
        <label>Styled date with a translated calendar
          <input class="pat-datetime-picker"
                 type="datetime-local"
                 value="2015-01-01T12:34"
                 data-pat-datetime-picker="behavior: styled; i18n: ../date-picker/i18n.json; output-format: Do MMMM YYYY; locale: de"
          />
        </label><br />
        <label>Editable date with a translated calendar
          <input class="pat-datetime-picker"
                 type="datetime-local"
                 value="2015-01-01T12:34"
                 data-pat-datetime-picker="behavior: editable; i18n: ../date-picker/i18n.json"
          />
        </label><br />
        <label>No value
          <input class="pat-datetime-picker"
                 type="datetime-local"
                 value=""
          />
        </label><br />
      </fieldset>
    </form>
  </body>
</html>
